<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Editor — Curry Caravan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .editor-wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.75rem; color: var(--text-muted); text-decoration: none;
      margin-bottom: 1.5rem; transition: color var(--transition);
    }
    .back-link:hover { color: var(--spice-amber); }

    .editor-header { margin-bottom: 1.5rem; }
    .editor-header h1 {
      font-family: var(--font-display); font-size: 1.8rem;
      background: linear-gradient(135deg, #f4a93b, #e0651a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 0.25rem;
    }
    .editor-header p { font-size: 0.8rem; color: var(--text-muted); }

    /* ── RECIPE LIST SIDEBAR ── */
    .editor-layout { display: grid; grid-template-columns: 240px 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 600px) { .editor-layout { grid-template-columns: 1fr; } }

    .recipe-sidebar {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card); overflow: hidden; position: sticky; top: 1rem;
    }

    .sidebar-header {
      padding: 0.75rem 1rem; background: var(--bg-inset);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--spice-chilli); font-weight: 500;
      display: flex; justify-content: space-between; align-items: center;
    }

    .recipe-list-sidebar { list-style: none; }

    .recipe-list-sidebar li {
      padding: 0.65rem 1rem; cursor: pointer; font-size: 0.85rem;
      color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle);
      transition: all var(--transition); display: flex; justify-content: space-between; align-items: center;
    }
    .recipe-list-sidebar li:last-child { border-bottom: none; }
    .recipe-list-sidebar li:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .recipe-list-sidebar li.active { background: var(--bg-inset); color: var(--spice-amber); }

    .recipe-list-sidebar li .cat-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }

    .btn-new-recipe {
      width: 100%; background: none; border: none; border-top: 1px dashed var(--border-mid);
      color: var(--text-muted); font-family: var(--font-body); font-size: 0.78rem;
      padding: 0.65rem 1rem; cursor: pointer; text-align: left;
      transition: all var(--transition);
    }
    .btn-new-recipe:hover { color: var(--spice-amber); background: var(--bg-card-hover); }

    /* ── FORM ── */
    .form-section {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card); padding: 1.1rem; margin-bottom: 0.75rem;
    }
    .form-section-title {
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--spice-chilli);
      margin-bottom: 0.875rem; display: flex; align-items: center; gap: 7px;
    }

    .field { margin-bottom: 0.75rem; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block; font-size: 0.7rem; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 0.3rem; letter-spacing: 0.03em;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--bg-inset); border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-family: var(--font-body); font-size: 0.875rem;
      padding: 0.55rem 0.8rem; outline: none; transition: border-color var(--transition);
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--spice-turmeric); }
    .field textarea { resize: vertical; min-height: 65px; line-height: 1.5; }
    .field select option { background: var(--bg-inset); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }

    /* ── STAGES ── */
    .stage-section {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card); overflow: hidden; margin-bottom: 0.75rem;
    }
    .stage-header {
      display: flex; align-items: center; gap: 8px; padding: 0.75rem 1.1rem;
      background: var(--bg-inset); border-bottom: 1px solid var(--border-subtle);
    }
    .stage-header h3 {
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--spice-amber); flex: 1;
    }
    .stage-body { padding: 0.875rem 1.1rem; }

    .step-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 0.5rem; }
    .step-item { display: flex; gap: 5px; align-items: center; }
    .step-item input {
      flex: 1; background: var(--bg-inset); border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-family: var(--font-body); font-size: 0.85rem;
      padding: 0.45rem 0.7rem; outline: none; transition: border-color var(--transition);
    }
    .step-item input:focus { border-color: var(--spice-turmeric); }
    .step-item input::placeholder { color: var(--text-muted); }

    .btn-remove {
      background: none; border: 1px solid var(--border-mid); border-radius: 6px;
      color: var(--text-muted); cursor: pointer; font-size: 0.75rem;
      padding: 0.35rem 0.55rem; transition: all var(--transition); flex-shrink: 0; line-height: 1;
    }
    .btn-remove:hover { border-color: var(--spice-chilli); color: var(--spice-chilli); }

    .btn-add {
      background: none; border: 1px dashed var(--border-mid); border-radius: var(--radius-sm);
      color: var(--text-muted); cursor: pointer; font-size: 0.75rem;
      padding: 0.4rem 0.8rem; width: 100%; text-align: left;
      transition: all var(--transition); font-family: var(--font-body);
    }
    .btn-add:hover { border-color: var(--spice-turmeric); color: var(--spice-amber); }

    /* ── ACTION BUTTONS ── */
    .form-actions { display: flex; gap: 0.75rem; margin-top: 0.75rem; }

    .btn-save {
      flex: 1; background: linear-gradient(135deg, #c84b18, #d4880a);
      border: none; border-radius: var(--radius-card); color: #fff;
      cursor: pointer; font-family: var(--font-display); font-size: 1rem;
      font-weight: 700; padding: 0.8rem; transition: opacity var(--transition), transform var(--transition);
    }
    .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-delete {
      background: none; border: 1px solid #5a2020; border-radius: var(--radius-card);
      color: #8a4040; cursor: pointer; font-family: var(--font-body);
      font-size: 0.8rem; padding: 0.8rem 1.2rem;
      transition: all var(--transition);
    }
    .btn-delete:hover { border-color: #c84b18; color: #c84b18; }

    /* ── DOWNLOAD BAR ── */
    .download-bar {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card); padding: 0.875rem 1.1rem;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; gap: 1rem;
    }
    .download-bar p { font-size: 0.8rem; color: var(--text-secondary); }
    .download-bar strong { color: var(--spice-amber); }

    .btn-download {
      background: var(--spice-green-bg); border: 1px solid var(--spice-green-border);
      border-radius: var(--radius-pill); color: var(--spice-green);
      cursor: pointer; font-size: 0.75rem; font-weight: 500;
      padding: 6px 16px; font-family: var(--font-body);
      transition: all var(--transition); white-space: nowrap;
    }
    .btn-download:hover { opacity: 0.85; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 3rem 1rem;
      color: var(--text-muted); font-size: 0.9rem;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--spice-green-bg); border: 1px solid var(--spice-green-border);
      color: var(--spice-green); font-size: 0.8rem; padding: 0.6rem 1.2rem;
      border-radius: var(--radius-pill); transition: transform 0.3s ease; z-index: 200;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .loading { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="editor-wrap">

    <a href="index.html" class="back-link">← Back to recipes</a>

    <div class="editor-header">
      <h1>Recipe Editor</h1>
      <p>Edit existing recipes or add new ones — download the updated recipes.json when done</p>
    </div>

    <!-- DOWNLOAD BAR -->
    <div class="download-bar">
      <p>When you're done editing, download and drop <strong>recipes.json</strong> into your project folder</p>
      <button class="btn-download" onclick="downloadJSON()">⬇ Download recipes.json</button>
    </div>

    <div class="editor-layout">

      <!-- SIDEBAR -->
      <div class="recipe-sidebar">
        <div class="sidebar-header">
          <span>Recipes</span>
          <span id="recipe-count" style="color:var(--text-muted)">0</span>
        </div>
        <ul class="recipe-list-sidebar" id="recipe-list-sidebar"></ul>
        <button class="btn-new-recipe" onclick="newRecipe()">+ New recipe</button>
      </div>

      <!-- MAIN FORM -->
      <div id="form-area">
        <div class="empty-state">← Select a recipe to edit, or add a new one</div>
      </div>

    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STAGES = [
      { id: "gather",   name: "Ingredient gathering", icon: "🧺", placeholder: "e.g. Red lentils (handful)" },
      { id: "choppy",   name: "Choppy bit",            icon: "🔪", placeholder: "e.g. Dice the onion" },
      { id: "fry",      name: "Fry-y bit",             icon: "🔥", placeholder: "e.g. Heat oil, add cumin seeds" },
      { id: "pressure", name: "Pressure cook",         icon: "⚡", placeholder: "e.g. Seal lid, HIGH 8 min" },
      { id: "post",     name: "Post pressure cook",    icon: "✨", placeholder: "e.g. Stir, taste, finish with lime" }
    ];

    const CAT_COLOURS = {
      "curry":        "#c84b18",
      "curried-pasta":"#d4880a",
      "indalian":     "#5a9e5a"
    };

    let allRecipes   = [];  // flat list for editing
    let originalData = null; // preserve original structure for download

    // Basic access check — not real security, just keeps randos out
    const password = prompt("Password:");
    if (password !== "yourpassword") {
      document.body.innerHTML = "<p style='color:#5a4a38;font-family:sans-serif;padding:2rem;'>Nope.</p>";
    }

    // ── LOAD ──────────────────────────────
    fetch("recipes.json?v=" + Date.now())
      .then(r => {
        console.log("Status:", r.status, "OK:", r.ok);
        return r.text();
      })
      .then(text => {
        console.log("Raw text:", text.substring(0, 200));
        const data = JSON.parse(text);
        originalData = data;

        // Flatten categories into a working list, tagging each recipe with its category id
        if (data.categories) {
          allRecipes = data.categories.flatMap(c =>
            (c.recipes || []).map(r => ({ ...r, category: r.category || c.name.toLowerCase().replace(/\s+/g, "-") }))
          );
        } else if (data.recipes) {
          allRecipes = data.recipes;
        } else {
          allRecipes = [];
        }
        renderSidebar();
      })
      .catch(() => {
        allRecipes = [];
        renderSidebar();
        showToast("Couldn't load recipes.json — starting fresh");
      });

    let activeIndex = null;

    // ── SIDEBAR ───────────────────────────
    function renderSidebar() {
      const list = document.getElementById("recipe-list-sidebar");
      document.getElementById("recipe-count").textContent = allRecipes.length;
      list.innerHTML = "";

      allRecipes.forEach((r, i) => {
        const li = document.createElement("li");
        li.dataset.index = i;
        if (i === activeIndex) li.className = "active";
        li.innerHTML = `
          <span>${r.name || "Untitled"}</span>
          <span class="cat-dot" style="background:${CAT_COLOURS[r.category] || "#5a4a38"}"></span>
        `;
        li.onclick = () => editRecipe(i);
        list.appendChild(li);
      });
    }

    // ── EDIT RECIPE ───────────────────────
    function editRecipe(index) {
      activeIndex = index;
      renderSidebar();
      const recipe = allRecipes[index];
      renderForm(recipe, index);
    }

    function newRecipe() {
      const blank = {
        name: "", category: "curry", description: "",
        cook_time: "", tags: [], stages: [], notes: []
      };
      allRecipes.push(blank);
      activeIndex = allRecipes.length - 1;
      renderSidebar();
      renderForm(blank, activeIndex);
    }

    // ── RENDER FORM ───────────────────────
    function renderForm(recipe, index) {
      const area = document.getElementById("form-area");

      const tagsStr = (recipe.tags || []).join(", ");

      // Build stage HTML
      const stagesHTML = STAGES.map(stage => {
        const existing = (recipe.stages || []).find(s => s.name === stage.name);
        const steps    = existing ? existing.steps : [];
        const stepsHTML = steps.length
          ? steps.map(s => stepItemHTML(stage.placeholder, s)).join("")
          : stepItemHTML(stage.placeholder, "");

        return `
          <div class="stage-section">
            <div class="stage-header">
              <span>${stage.icon}</span>
              <h3>${stage.name}</h3>
            </div>
            <div class="stage-body">
              <div class="step-list" id="list-${stage.id}">${stepsHTML}</div>
              <button class="btn-add" onclick="addStep('list-${stage.id}', '${stage.placeholder}')">+ Add step</button>
            </div>
          </div>
        `;
      }).join("");

      // Notes
      const notesSteps = (recipe.notes || []);
      const notesHTML  = notesSteps.length
        ? notesSteps.map(n => stepItemHTML("e.g. Adjust water if needed", n)).join("")
        : stepItemHTML("e.g. Adjust water if needed", "");

      area.innerHTML = `
        <!-- BASICS -->
        <div class="form-section">
          <div class="form-section-title"><span>📋</span> Basic info</div>
          <div class="field">
            <label>Recipe name</label>
            <input type="text" id="f-name" value="${esc(recipe.name)}" placeholder="e.g. Toor Dal" />
          </div>
          <div class="field">
            <label>Description</label>
            <textarea id="f-description" placeholder="One line about the dish...">${esc(recipe.description)}</textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Category</label>
              <select id="f-category">
                <option value="curry"         ${recipe.category === "curry"         ? "selected" : ""}>Curry</option>
                <option value="curried-pasta" ${recipe.category === "curried-pasta" ? "selected" : ""}>Curried Pasta</option>
                <option value="indalian"      ${recipe.category === "indalian"      ? "selected" : ""}>Indalian</option>
              </select>
            </div>
            <div class="field">
              <label>Cook time</label>
              <input type="text" id="f-cook_time" value="${esc(recipe.cook_time)}" placeholder="e.g. 8 min" />
            </div>
          </div>
          <div class="field">
            <label>Tags <span style="color:var(--text-muted);font-weight:400">(comma separated)</span></label>
            <input type="text" id="f-tags" value="${esc(tagsStr)}" placeholder="e.g. lentil, dal, veg" />
          </div>
        </div>

        <!-- STAGES -->
        ${stagesHTML}

        <!-- NOTES -->
        <div class="form-section">
          <div class="form-section-title"><span>🗒</span> Notes</div>
          <div class="step-list" id="list-notes">${notesHTML}</div>
          <button class="btn-add" onclick="addStep('list-notes', 'e.g. Adjust water if needed')">+ Add note</button>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
          <button class="btn-save" onclick="saveRecipe(${index})">Save recipe</button>
          <button class="btn-delete" onclick="deleteRecipe(${index})">Delete</button>
        </div>
      `;
    }

    function stepItemHTML(placeholder, value) {
      return `
        <div class="step-item">
          <input type="text" placeholder="${placeholder}" value="${esc(value)}" />
          <button class="btn-remove" onclick="removeStep(this)">✕</button>
        </div>
      `;
    }

    function addStep(listId, placeholder) {
      const list = document.getElementById(listId);
      const div  = document.createElement("div");
      div.className = "step-item";
      div.innerHTML = `
        <input type="text" placeholder="${placeholder}" />
        <button class="btn-remove" onclick="removeStep(this)">✕</button>
      `;
      list.appendChild(div);
      div.querySelector("input").focus();
    }

    function removeStep(btn) {
      const item = btn.closest(".step-item");
      const list = item.parentElement;
      if (list.children.length > 1) {
        item.remove();
      } else {
        item.querySelector("input").value = "";
      }
    }

    // ── SAVE ──────────────────────────────
    function saveRecipe(index) {
      const name        = document.getElementById("f-name").value.trim();
      const description = document.getElementById("f-description").value.trim();
      const category    = document.getElementById("f-category").value;
      const cook_time   = document.getElementById("f-cook_time").value.trim();
      const tagsRaw     = document.getElementById("f-tags").value.trim();
      const tags        = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];

      const stages = STAGES.map(stage => ({
        name:  stage.name,
        icon:  stage.icon,
        steps: getSteps(`list-${stage.id}`)
      })).filter(s => s.steps.length > 0);

      const notes = getSteps("list-notes");

      const recipe = { name, category, description, cook_time, tags, stages };
      if (notes.length) recipe.notes = notes;

      allRecipes[index] = recipe;
      renderSidebar();
      showToast("Recipe saved — download when ready");
    }

    function deleteRecipe(index) {
      if (!confirm(`Delete "${allRecipes[index].name || "this recipe"}"?`)) return;
      allRecipes.splice(index, 1);
      activeIndex = null;
      document.getElementById("form-area").innerHTML = '<div class="empty-state">Recipe deleted. Select another or add a new one.</div>';
      renderSidebar();
      showToast("Recipe deleted");
    }

    function getSteps(listId) {
      return Array.from(document.querySelectorAll(`#${listId} .step-item input`))
        .map(i => i.value.trim())
        .filter(v => v !== "");
    }

    // ── DOWNLOAD ──────────────────────────
    function downloadJSON() {
      // Rebuild nested categories structure from flat allRecipes list
      const CATEGORY_ORDER = [
        { id: "curry",         name: "Curry" },
        { id: "curried-pasta", name: "Curried Pasta" },
        { id: "indalian",      name: "Indalian" }
      ];

      const categories = CATEGORY_ORDER.map(cat => ({
        name: cat.name,
        recipes: allRecipes
          .filter(r => r.category === cat.id)
          .map(({ category, ...rest }) => rest) // strip the category field from each recipe
      })).filter(c => c.recipes.length > 0);

      const data = JSON.stringify({ categories }, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = "recipes.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Downloaded recipes.json");
    }

    // ── UTILS ─────────────────────────────
    function esc(str) {
      return (str || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }
  </script>
</body>
</html>
